<!-- ============================================================
     No-JS fallback: the portfolio content is also plain HTML below,
     so the site is fully readable (and crawlable) without WebGL or JS.
     Hidden as soon as the world boots.
     ============================================================ -->
<main id="fallback">
  <h1>ALISH SHRESTHA</h1>
  <p class="role">AI STUDENT • WEB DEVELOPER • CREATOR</p>
  <p>This portfolio is a 3D voxel world. Your browser could not start WebGL, so here is the same content in plain text.</p>

     <a href="https://www.facebook.com/alish.shrestha.138982/">Facebook</a> ·
     <a href="https://wa.me/9779826328462">WhatsApp</a></p>
</main>

<script type="importmap">
{
  "imports": {
    "three": "./js/vendor/three.module.min.js"
  }
}
</script>
<script type="module">
  // Boot inside try/catch: if WebGL or the network is unavailable we simply
  // leave the plain-HTML fallback visible instead of a blank page.
  import('./js/main.js')
    .then(m => document.body.classList.add('world-ready'))
    .catch(err => {
      console.error('[portfolio] world failed to start:', err);
      document.body.classList.add('world-failed');
    });
</script>

</body>

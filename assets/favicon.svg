<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0066FF"/>
    </linearGradient>
  </defs>

  <style>
    .tile-bg { fill: #FFFFFF; stroke: #E2E8F0; }
    .gear-symbol { fill: url(#gearGrad); }
    .center-bore { fill: #0052CC; }
    .sparkle-icon { fill: #FFFFFF; }
    
    @media (prefers-color-scheme: dark) {
      .tile-bg { fill: #121214; stroke: #27272A; }
      .center-bore { fill: #0B3280; }
      .sparkle-icon { fill: #38BDF8; }
    }
  </style>

  <!-- Clean squircle tile background for perfect contrast across light & dark browser tabs -->
  <rect class="tile-bg" x="1.5" y="1.5" width="29" height="29" rx="8" stroke-width="1.5"/>

  <!-- Mechanical Gear (Signature Blue Gear from P⚙RTFOLIO) -->
  <path class="gear-symbol" fill-rule="evenodd" clip-rule="evenodd" d="
    M 13.8,4.5 L 18.2,4.5 L 18.5,7.8 Q 19.9,8.4 21.2,9.3 L 24.3,6.8 L 27.2,9.7 L 24.6,12.7 Q 25.5,14 26.1,15.4 L 29.5,15.7 L 29.5,19.3 L 26.1,19.6 Q 25.5,21 24.6,22.3 L 27.2,25.3 L 24.3,28.2 L 21.2,25.7 Q 19.9,26.6 18.5,27.2 L 18.2,30.5 L 13.8,30.5 L 13.5,27.2 Q 12.1,26.6 10.8,25.7 L 7.7,28.2 L 4.8,25.3 L 7.4,22.3 Q 6.5,21 5.9,19.6 L 2.5,19.3 L 2.5,15.7 L 5.9,15.4 Q 6.5,14 7.4,12.7 L 4.8,9.7 L 7.7,6.8 L 10.8,9.3 Q 12.1,8.4 13.5,7.8 Z
    M 16,11.5 A 4.5,4.5 0 1,0 16,20.5 A 4.5,4.5 0 1,0 16,11.5 Z
  "/>

  <!-- Center Hole Background & Editorial Sparkle ✦ -->
  <circle class="center-bore" cx="16" cy="16" r="3.6"/>
  <path class="sparkle-icon" d="M 16,13.4 L 16.5,15.4 L 18.5,16 L 16.5,16.6 L 16,18.6 L 15.5,16.6 L 13.5,16 L 15.5,15.4 Z"/>
</svg>
